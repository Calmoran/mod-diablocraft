# Python checking, scoped deliberately narrow.
#
# mod-diablocraft/scripts/ is mostly single-purpose generators and one-shot test
# harnesses written to be run once and read never. Type-checking them produced
# 30 findings, none of them defects, and blocked the Stop hook on every turn.
#
# So mypy checks the one script that is a maintained tool and gates real data:
# validate_csv.py. Widen this list when a script becomes something people call
# repeatedly - and annotate it at that point, rather than the reverse.
[mypy]
python_version = 3.11
files = mod-diablocraft/scripts/validate_csv.py
strict = True
warn_unreachable = True
show_error_codes = True
pretty = True
